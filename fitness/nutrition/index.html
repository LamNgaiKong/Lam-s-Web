<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000005;
    forced-color-adjust: none;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

  #graph { position: fixed; inset: 0; background: #000005; forced-color-adjust: none; }
  #graph canvas { forced-color-adjust: none; }
  .ui-top, .ui-top a, .ui-top .badge, .bottom-ui, .legend, .actions button, .hint, #loading { forced-color-adjust: none; }

  /* 顶部 */
  .ui-top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; pointer-events: none;
    background: linear-gradient(#00000099, transparent);
  }
  .ui-top a, .ui-top .badge { pointer-events: auto; color: #cdd6f4; font-size: 14px; text-decoration: none; }
  .ui-top a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px;
    border: 1px solid #3a3f5c; background: #11142a99;
    backdrop-filter: blur(6px); transition: border-color .16s, color .16s;
  }
  .ui-top a:hover { color: #fff; border-color: #6f7ab8; text-decoration: none; }
  .ui-top .badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: #e7e9ff; text-shadow: 0 0 12px #7b6cff88; }
  .ui-top .badge small { font-weight: 400; color: #8b90b8; font-size: 12px; }

  /* 底部：图例 + 操作按钮 */
  .bottom-ui {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    width: max-content; max-width: calc(100vw - 24px);
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 18px; justify-content: center;
    padding: 9px 18px; border-radius: 999px;
    background: #0a0d1a99; border: 1px solid #2a2f45; backdrop-filter: blur(8px);
    font-size: 12.5px; color: #aeb4d4;
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .legend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .legend .star   { background: radial-gradient(circle, #fff6c0 0%, #ffb347 55%, #ff7a18 100%); box-shadow: 0 0 10px #ffb347; }
  .legend .planet { background: radial-gradient(circle, #6b7bd6 0%, #2b3d8f 70%); box-shadow: 0 0 6px #4a5bb8; }
  .legend .moon   { background: radial-gradient(circle, #4fd6a0 0%, #1d9e6c 70%); box-shadow: 0 0 6px #1d9e6c; }
  .legend .topic  { background: radial-gradient(circle, #b6bdcf 0%, #8f98a8 70%); }

  .actions { display: flex; gap: 10px; }
  .actions button {
    appearance: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; min-height: 38px; border-radius: 999px;
    font: inherit; font-size: 13px;
    color: #cdd6f4; background: #11142a99; border: 1px solid #3a3f5c;
    backdrop-filter: blur(8px); transition: border-color .16s, color .16s, background .16s;
  }
  .actions button:hover { color: #fff; border-color: #6f7ab8; background: #1a1f3a99; }
  .actions button:active { transform: scale(.97); }

  /* 提示 */
  .hint {
    position: fixed; right: 22px; bottom: 22px; z-index: 20;
    font-size: 12px; color: #7d84a8; text-align: right; line-height: 1.7; pointer-events: none;
  }
  @media (max-width: 760px) { .hint { display: none; } }

  /* 加载态 */
  #loading {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    color: #8f97c4; font-size: 14px; background: #000005; transition: opacity .5s ease;
  }
  #loading .ring {
    width: 42px; height: 42px; border-radius: 50%;
    border: 2px solid #2a2f45; border-top-color: #ffb347;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading.is-hidden { opacity: 0; pointer-events: none; }
  #loading .err { color: #f88; max-width: 460px; text-align: center; line-height: 1.7; }

  /* 无 WebGL 时的降级目录 */
  #fallback[hidden] { display: none; }
  #fallback {
    position: fixed; inset: 0; z-index: 15; overflow-y: auto;
    padding: 96px 24px 70px; background: #000005; color: #cdd6f4;
  }
  #fallback .fb-inner { max-width: 820px; margin: 0 auto; }
  #fallback h1 { font-size: 22px; margin-bottom: 12px; color: #fff; }
  #fallback .fb-note {
    font-size: 13.5px; line-height: 1.75; color: #9aa3c7;
    background: #161a2e; border: 1px solid #2c3350; border-radius: 10px;
    padding: 13px 16px; margin-bottom: 28px;
  }
  #fallback h2 { font-size: 17px; margin: 28px 0 10px; color: #ffd27a; }
  #fallback ul { list-style: none; padding: 0; }
  #fallback li { margin: 4px 0; font-size: 14px; line-height: 1.5; }
  #fallback li.fb-depth-3 { padding-left: 22px; font-size: 13px; }
  #fallback li.fb-depth-2 { padding-left: 2px; }
  #fallback a { color: #aeb8e8; text-decoration: none; }
  #fallback a:hover { color: #fff; text-decoration: underline; }

  /* 亮色模式：页面底色与按钮对比 */
  /* 星系页固定深色主题：亮色模式下也保持深空背景，避免切换主题时白屏 */
</style>

<script>
  // 兜底：把错误显示在页面上，避免"白板"
  window.__galaxyFail = function (msg) {
    var l = document.getElementById('loading');
    if (l) {
      l.classList.remove('is-hidden');
      l.style.opacity = '1';
      l.innerHTML = '<div class="err">3D 加载出错：<br>' + String(msg) + '</div>';
    }
  };
  window.addEventListener('error', function (e) { window.__galaxyFail((e && e.message) || '未知错误'); });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    window.__galaxyFail((r && (r.message || String(r))) || '未知 Promise 错误');
  });
</script>

<script type="module">
// ---------- 数据 ----------
const TREE = window.NSCA_TREE || { nodes: [], links: [] };
const NOTES = window.NSCA_NOTES || { relations: [] };
const nodeIds = new Set(TREE.nodes.map(n => n.id));
const isMobile = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth < 768;

// ---------- WebGL 检测 ----------
function hasWebGL() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}

// ---------- 降级：完整笔记目录 ----------
function webglDiagnostic() {
  const r = { webgl2: false, webgl1: false };
  try { const c = document.createElement('canvas'); r.webgl2 = !!(c.getContext('webgl2')); } catch (e) {}
  try { const c = document.createElement('canvas'); r.webgl1 = !!(c.getContext('webgl') || c.getContext('experimental-webgl')); } catch (e) {}
  return r;
}

function renderFallback() {
  const loading = document.getElementById('loading');
  if (loading) loading.remove();
  // 隐藏 3D 专用 UI
  document.querySelectorAll('.bottom-ui, .hint').forEach(el => { el.style.display = 'none'; });
  const fb = document.getElementById('fallback');
  if (!fb) return;
  fb.hidden = false;
  const d = webglDiagnostic();
  const note = fb.querySelector('.fb-note');
  if (note && !note.dataset.diag) {
    note.dataset.diag = '1';
    note.insertAdjacentHTML('beforeend',
      '<br><small style="color:#f0a">自检：WebGL2 = ' + (d.webgl2 ? '可用' : '不可用') +
      '；WebGL1 = ' + (d.webgl1 ? '可用' : '不可用') + '</small>');
  }
  const groups = document.getElementById('fb-groups');
  if (!groups || groups.children.length) return;
  TREE.nodes.filter(n => n.depth === 1).forEach(ch => {
    const h = document.createElement('h2');
    h.textContent = ch.name;
    groups.appendChild(h);
    const ul = document.createElement('ul');
    TREE.nodes.filter(n => n.depth >= 2 && n.id.split('/')[0] === ch.id).forEach(n => {
      const li = document.createElement('li');
      li.className = 'fb-depth-' + n.depth;
      const a = document.createElement('a');
      a.href = n.file;
      a.textContent = n.name;
      li.appendChild(a);
      ul.appendChild(li);
    });
    groups.appendChild(ul);
  });
}

// ---------- 3D 星系 ----------
async function initGalaxy() {
  // 依赖：本地优先，CDN 兜底
  let THREE = null;
  try {
    THREE = await import('../../assets/js/vendor/three.module.js');
  } catch (e) {
    try { THREE = await import('https://esm.sh/three'); }
    catch (e2) { console.warn('[galaxy] THREE 加载失败，降级为内置球体渲染', e2); }
  }

  let UnrealBloomPass = null;
  if (THREE) {
    try {
      const m = await import('../../assets/js/vendor/postprocessing/UnrealBloomPass.js');
      UnrealBloomPass = m.UnrealBloomPass;
    } catch (e) {
      try {
        const m = await import('https://esm.sh/three/examples/jsm/postprocessing/UnrealBloomPass.js');
        UnrealBloomPass = m.UnrealBloomPass;
      } catch (e2) { console.warn('[galaxy] Bloom 加载失败，跳过泛光', e2); }
    }
  }

  function categoryOf(n) {
    if (n.depth === 0) return 'star';
    if (n.depth === 1) return 'planet';
    if (n.depth === 2) return 'moon';
    return 'topic';
  }
  const RADIUS = { star: 4.2, planet: 2.7, moon: 1.6, topic: 1.0 };
  const VAL    = { star: 90, planet: 34, moon: 14, topic: 5 };
  const COLOR  = { star: '#ffb347', planet: '#2b3d8f', moon: '#1d9e6c', topic: '#8f98a8' };

  // 恒光辉光纹理
  let glowTex = null;
  if (THREE) {
    const s = 256, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, 'rgba(255,255,235,1)');
    g.addColorStop(0.18, 'rgba(255,220,120,0.9)');
    g.addColorStop(0.45, 'rgba(255,150,40,0.35)');
    g.addColorStop(1, 'rgba(255,120,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    glowTex = new THREE.CanvasTexture(cv);
    glowTex.needsUpdate = true;
  }

  if (typeof ForceGraph3D === 'undefined') throw new Error('3D 引擎未能加载（ForceGraph3D 未定义）');

  const graph = new ForceGraph3D(document.getElementById('graph'), {
      controlType: 'orbit',
      rendererConfig: {
        antialias: !isMobile,
        failIfMajorPerformanceCaveat: false,
        powerPreference: 'default'
      }
    })
    .backgroundColor('#000005')
    .showNavInfo(false)
    .nodeVal(n => VAL[categoryOf(n)] || 5)
    .nodeLabel(n => n.name)
    .onNodeClick(node => { if (node && node.file) window.location.href = node.file; });

  if (THREE) {
    graph.nodeThreeObject(node => {
      const cat = categoryOf(node);
      const r = RADIUS[cat];
      if (cat === 'star') {
        const grp = new THREE.Group();
        const glow = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowTex, color: 0xffd27a, blending: THREE.AdditiveBlending,
          transparent: true, depthWrite: false, opacity: 1
        }));
        glow.scale.set(46, 46, 1);
        grp.add(glow);
        grp.add(new THREE.Mesh(
          new THREE.SphereGeometry(r, 32, 32),
          new THREE.MeshBasicMaterial({ color: 0xfff4c0 })
        ));
        return grp;
      }
      if (cat === 'planet') {
        return new THREE.Mesh(
          new THREE.SphereGeometry(r, 32, 32),
          new THREE.MeshPhongMaterial({ color: 0x2b3d8f, emissive: 0x131a45, shininess: 60, specular: 0x9aa8ff })
        );
      }
      if (cat === 'moon') {
        return new THREE.Mesh(
          new THREE.SphereGeometry(r, 24, 24),
          new THREE.MeshPhongMaterial({ color: 0x1d9e6c, emissive: 0x0a3a26, shininess: 30, specular: 0x7fe6b8 })
        );
      }
      return new THREE.Mesh(
        new THREE.SphereGeometry(r, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x8f98a8 })
      );
    });
  } else {
    graph.nodeColor(n => COLOR[categoryOf(n)] || '#8f98a8');
  }

  // 合并数据：层级边 + 跨章节关联边
  const links = TREE.links.map(l => ({ source: l.source, target: l.target, kind: 'tree' }));
  (NOTES.relations || []).forEach(r => {
    if (nodeIds.has(r.from) && nodeIds.has(r.to)) links.push({ source: r.from, target: r.to, kind: 'relation' });
  });
  graph.linkColor(l => l.kind === 'relation' ? '#ffb347' : 'rgba(120,150,220,0.32)')
       .linkWidth(l => l.kind === 'relation' ? 1.6 : 0.4)
       .linkOpacity(0.6);
  graph.graphData({ nodes: TREE.nodes.slice(), links });

  // 灯光 + 星空
  let starfield = null;
  if (THREE) {
    const scene = graph.scene();
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 0.95); key.position.set(1, 1.2, 1); scene.add(key);
    const rim = new THREE.DirectionalLight(0x7080ff, 0.55); rim.position.set(-1, -0.8, -0.6); scene.add(rim);

    const count = isMobile ? 800 : 2600;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const rr = 700 + Math.random() * 1500;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      pos[i*3]   = rr * Math.sin(ph) * Math.cos(th);
      pos[i*3+1] = rr * Math.sin(ph) * Math.sin(th);
      pos[i*3+2] = rr * Math.cos(ph);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: 0xffffff, size: isMobile ? 2.2 : 1.8, sizeAttenuation: true,
      transparent: true, opacity: 0.85, depthWrite: false
    });
    starfield = new THREE.Points(geo, mat);
    scene.add(starfield);
  }

  // 泛光
  let bloom = null;
  if (THREE && UnrealBloomPass) {
    try {
      bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.65, 0.12);
      graph.postProcessingComposer().addPass(bloom);
    } catch (e) { console.warn('[galaxy] Bloom 初始化失败，跳过', e); bloom = null; }
  }

  // 像素比
  try {
    const r = graph.renderer && graph.renderer();
    if (r && r.setPixelRatio) r.setPixelRatio(isMobile ? 1.5 : 2);
  } catch (e) {}

  // 相机 / 重置视角
  let homeCam = { x: 0, y: 130, z: 300 };
  let fitted = false;
  function fitOnce() {
    if (fitted) return;
    fitted = true;
    try { graph.zoomToFit(800, 60); } catch (e) {}
    setTimeout(() => {
      try { const p = graph.cameraPosition(); homeCam = { x: p.x, y: p.y, z: p.z }; } catch (e) {}
    }, 1200);
  }
  graph.onEngineStop(fitOnce);
  setTimeout(fitOnce, 3000);

  const controls = graph.controls();
  if (controls) { controls.autoRotate = true; controls.autoRotateSpeed = 0.3; }

  const resetBtn = document.getElementById('reset-view');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    try { graph.cameraPosition(homeCam, { x: 0, y: 0, z: 0 }, 900); } catch (e) {}
  });

  // 主题联动
  function applyTheme() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    /* 星系背景固定深空色，不随主题切换（避免重建渲染上下文导致白屏） */
    if (starfield) starfield.material.opacity = dark ? 0.9 : 0.35;
    if (bloom) bloom.strength = dark ? (isMobile ? 1.0 : 1.5) : (isMobile ? 0.55 : 0.85);
    const tbtn = document.getElementById('theme-toggle');
    if (tbtn) tbtn.textContent = dark ? '☀️' : '🌙';
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#000005' : '#28313f');
  }
  applyTheme();

  const tbtn = document.getElementById('theme-toggle');
  if (tbtn) tbtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('lam-web-theme', next); } catch (e) {}
    applyTheme();
  });

  // 收尾
  document.getElementById('graph').dataset.ok = '1';
  const loading = document.getElementById('loading');
  if (loading) { loading.classList.add('is-hidden'); setTimeout(() => loading.remove(), 600); }
}

// ---------- 2D 降级图谱（无 WebGL 时使用，Canvas 2D） ----------
function render2D() {
  try {
    const container = document.getElementById('graph');
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab';
    container.innerHTML = '';
    container.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('canvas 2d unavailable');

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let W = innerWidth, H = innerHeight;

    // 径向树布局
    const byId = {};
    TREE.nodes.forEach(n => { byId[n.id] = n; n._x = 0; n._y = 0; });
    const children = {};
    TREE.nodes.forEach(n => { children[n.id] = []; });
    TREE.links.forEach(l => {
      if (byId[l.source] && byId[l.target]) children[l.source].push(l.target);
    });
    const root = TREE.nodes.find(n => n.depth === 0) || TREE.nodes[0];
    const R = [0, 190, 380, 580];
    (function place(id, a0, a1, depth) {
      const n = byId[id];
      if (!n) return;
      const mid = (a0 + a1) / 2;
      const r = R[Math.min(depth, 3)];
      n._x = Math.cos(mid) * r;
      n._y = Math.sin(mid) * r;
      const kids = children[id] || [];
      if (!kids.length) return;
      const step = (a1 - a0) / kids.length;
      kids.forEach((kid, i) => place(kid, a0 + i * step, a0 + (i + 1) * step, depth + 1));
    })(root.id, -Math.PI / 2, Math.PI * 1.5, 0);

    const RAD = { 0: 11, 1: 8, 2: 5, 3: 3.5 };
    const COL = { 0: '#ffb347', 1: '#5b6fd6', 2: '#1d9e6c', 3: '#8f98a8' };
    const relLinks = (NOTES.relations || []).filter(r => byId[r.from] && byId[r.to]);

    let view = { x: 0, y: 0, k: 1 };
    let drag = null, moved = false;

    function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
    function fitScale() { return Math.min(W, H) / (2 * 640) * 0.92; }

    function draw() {
      const dark = isDark();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = dark ? '#000005' : '#28313f';
      ctx.fillRect(0, 0, W, H);

      const k = fitScale() * view.k;
      const cx = W / 2 + view.x;
      const cy = H / 2 + view.y;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(k, k);

      // 层级连线
      ctx.lineWidth = 1 / k;
      ctx.strokeStyle = dark ? 'rgba(120,150,220,0.32)' : 'rgba(200,220,255,0.35)';
      ctx.beginPath();
      TREE.links.forEach(l => {
        const a = byId[l.source], b = byId[l.target];
        if (!a || !b) return;
        ctx.moveTo(a._x, a._y);
        ctx.lineTo(b._x, b._y);
      });
      ctx.stroke();

      // 跨章节关联
      ctx.strokeStyle = '#ffb347';
      ctx.lineWidth = 1.6 / k;
      ctx.beginPath();
      relLinks.forEach(r => {
        ctx.moveTo(byId[r.from]._x, byId[r.from]._y);
        ctx.lineTo(byId[r.to]._x, byId[r.to]._y);
      });
      ctx.stroke();

      // 节点
      TREE.nodes.forEach(n => {
        const d = n.depth || 0;
        ctx.beginPath();
        ctx.arc(n._x, n._y, RAD[d] || 4, 0, Math.PI * 2);
        ctx.fillStyle = COL[d] || '#8f98a8';
        ctx.shadowColor = COL[d] || '#8f98a8';
        ctx.shadowBlur = (d === 0 ? 24 : d === 1 ? 10 : 4) / k;
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // 标签（总览/章节/小节）
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      TREE.nodes.forEach(n => {
        const d = n.depth || 0;
        if (d > 2) return;
        const size = (d === 0 ? 15 : d === 1 ? 12 : 10) / k;
        ctx.font = (d === 0 ? '600 ' : '') + size + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillStyle = dark ? (d === 0 ? '#ffe3a3' : '#cdd6f4') : '#eef2fb';
        ctx.fillText(n.name, n._x, n._y - (RAD[d] + 11) / k);
      });

      ctx.restore();
    }

    function hitTest(clientX, clientY) {
      const k = fitScale() * view.k;
      const cx = W / 2 + view.x;
      const cy = H / 2 + view.y;
      let best = null, bestD = Infinity;
      TREE.nodes.forEach(n => {
        const sx = cx + n._x * k, sy = cy + n._y * k;
        const d = Math.hypot(clientX - sx, clientY - sy);
        if (d < bestD) { bestD = d; best = n; }
      });
      return bestD <= 20 ? best : null;
    }

    function resize() {
      W = innerWidth; H = innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      draw();
    }

    canvas.addEventListener('click', (e) => {
      if (moved) return;
      const n = hitTest(e.clientX, e.clientY);
      if (n && n.file) window.location.href = n.file;
    });
    canvas.addEventListener('pointerdown', (e) => {
      drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
      moved = false;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      canvas.style.cursor = 'grabbing';
    });
    canvas.addEventListener('pointermove', (e) => {
      if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        view.x = drag.vx + dx;
        view.y = drag.vy + dy;
        draw();
      } else {
        canvas.style.cursor = hitTest(e.clientX, e.clientY) ? 'pointer' : 'grab';
      }
    });
    canvas.addEventListener('pointerup', () => { drag = null; canvas.style.cursor = 'grab'; });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      view.k = Math.max(0.35, Math.min(3, view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
      draw();
    }, { passive: false });

    // 主题按钮
    function syncIcon() {
      const t = document.getElementById('theme-toggle');
      if (t) t.textContent = isDark() ? '☀️' : '🌙';
    }
    const tbtn = document.getElementById('theme-toggle');
    if (tbtn) tbtn.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('lam-web-theme', next); } catch (e) {}
      syncIcon();
      draw();
    });
    if (window.MutationObserver) {
      new MutationObserver(() => { syncIcon(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }
    syncIcon();

    const hint = document.querySelector('.hint');
    if (hint) hint.style.display = 'none';

    resize();
    window.addEventListener('resize', resize);
    document.getElementById('graph').dataset.ok = '1';
    const loading = document.getElementById('loading');
    if (loading) { loading.classList.add('is-hidden'); setTimeout(() => loading.remove(), 400); }
  } catch (e) {
    console.warn('[2d] 降级失败，回退目录', e);
    renderFallback();
  }
}

// ---------- 入口 ----------
if (hasWebGL()) {
  initGalaxy().catch(e => {
    console.error('[galaxy] 初始化失败，降级为 2D 图谱：', e);
    render2D();
  });
} else {
  render2D();
}
</script>

<script>
  // 兜底：15 秒仍未就绪则显示降级目录
  setTimeout(function () {
    var g = document.getElementById('graph');
    var l = document.getElementById('loading');
    if (g && !g.dataset.ok && l) {
      var fb = document.getElementById('fallback');
      if (fb) { l.remove(); document.querySelectorAll('.bottom-ui, .hint').forEach(function (el) { el.style.display = 'none'; }); fb.hidden = false; }
      else { l.innerHTML = '<div class="err">3D 场景加载超时，请刷新重试。</div>'; }
    }
  }, 15000);
</script>

</body>
</html>
