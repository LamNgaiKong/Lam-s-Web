  (function () { var t = null; try { t = localStorage.getItem('lam-web-theme'); } catch (e) {}

<style>
  /* ==========================================================================
     NSCA 知识图谱页 · 页内专用样式
     ========================================================================== */

  .backlink {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; color: var(--muted); margin-bottom: 20px;
    transition: color .16s var(--ease);
  }
  .backlink:hover { color: var(--accent); text-decoration: none; }

  /* 图谱容器：白色（暗色下深色）圆角卡片 + 细微阴影 */
  .graph-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 8px;
    overflow: hidden;
  }
  #graph {
    width: 100%;
    height: min(74vh, 760px);
    min-height: 480px;
  }

  /* 图例 */
  .graph-legend {
    display: flex; flex-wrap: wrap; gap: 18px; justify-content: center;
    margin-top: 16px; font-size: 12.5px; color: var(--muted);
  }
  .legend-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 6px; vertical-align: -1px;
  }
  .legend-dot--root { background: var(--accent-2); }
  .legend-dot--built { background: var(--accent); }
  .legend-dot--section { background: #0d9488; }
  .legend-dot--todo { background: var(--muted-2); }
  [data-theme="dark"] .legend-dot--section { background: #2dd4bf; }

  /* 点击未建节点的提示 */
  .graph-toast {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    padding: 9px 16px; border-radius: 999px;
    background: var(--text); color: var(--bg);
    font-size: 13px; box-shadow: var(--shadow-md);
    z-index: 6; pointer-events: none; white-space: nowrap;
  }
  .graph-toast[hidden] { display: none; }

  .mindmap-hint {
    margin: 16px 4px 0;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 720px) {
    #graph { height: 66vh; min-height: 420px; }
  }
</style>
</head>
